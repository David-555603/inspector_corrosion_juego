<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorroDetective - Inspector de Corrosión</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
  <div id="ui-overlay">
    <h1>🛠️ CorroDetective</h1>
    <div id="hud">
      <span>Dinero: $<span id="money">1500</span></span>
      <span>Nivel: <span id="level">1</span></span>
      <span>Strikes: <span id="strikes">0</span>/3</span>
    </div>
    <button id="reset-btn" style="margin-top:8px; padding:8px 16px;">Reiniciar Nivel</button>
  </div>

  <div id="game-container"></div>

  <!-- Modal de Inspección -->
  <div id="inspection-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">Inspección en curso...</h2>
      <img id="corrosion-image" src="" alt="Corrosión" style="width:100%; max-height:300px; border-radius:8px;">
      <p id="modal-description"></p>
      
      <div id="options-container"></div>
      
      <button id="close-modal" style="margin-top:15px;">Cerrar</button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
