<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorroDetective - Inspector de Corrosión</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      background: #0a1f2f;
      color: #00ff9d;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(10, 31, 47, 0.95);
      padding: 12px 20px;
      text-align: center;
      border-bottom: 2px solid #00ff9d;
    }
    h1 {
      font-size: 2.4em;
      text-shadow: 0 0 15px #00ff9d;
      margin-bottom: 5px;
    }
    #hud {
      display: flex;
      justify-content: center;
      gap: 40px;
      font-size: 1.4em;
      font-weight: bold;
    }
    button {
      background: #00aa77;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
    }
    button:hover { background: #00ff9d; color: #000; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #112233;
      padding: 25px;
      border-radius: 12px;
      max-width: 700px;
      width: 90%;
      border: 3px solid #00ff9d;
      text-align: center;
    }
    #options-container button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 14px;
      font-size: 1.1em;
      background: #223344;
      border: 2px solid #00aa88;
      color: #00ff9d;
    }
    #options-container button:hover {
      background: #00aa77;
      color: white;
    }
    #corrosion-image {
      width: 100%;
      max-height: 320px;
      border-radius: 8px;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <h1>🛠️ CorroDetective</h1>
    <div id="hud">
      <span>Dinero: $<span id="money">1500</span></span>
      <span>Nivel: <span id="level">1</span></span>
      <span>Strikes: <span id="strikes">0</span>/3</span>
    </div>
    <button id="reset-btn" style="margin-top:10px;">Reiniciar Nivel</button>
  </div>

  <div id="game-container"></div>

  <!-- Modal de Inspección -->
  <div id="inspection-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">Inspección en curso...</h2>
      <img id="corrosion-image" src="" alt="Corrosión">
      <p id="modal-description"></p>
      <div id="options-container"></div>
      <button id="close-modal" style="margin-top:15px; padding:10px 20px;">Cerrar</button>
    </div>
  </div>

  <script>
    // ==================== DATOS DEL JUEGO ====================
    const gameData = {
      currentLevel: 1,
      money: 1500,
      strikes: 0,
      
      levels: [
        {
          id: 1,
          name: "Tanque de Almacenamiento",
          background: "#1a3c2f",
          budget: 1500,
          maxStrikes: 3,
          areas: [
            {
              id: 1,
              x: 280, y: 200, width: 140, height: 90,
              name: "Base del tanque",
              type: "uniforme",
              image: "https://picsum.photos/id/1015/800/500",
              description: "Daño generalizado y uniforme en la superficie inferior.",
              options: [
                { text: "Corrosión Uniforme", correct: true },
                { text: "Pitting", correct: false },
                { text: "Corrosión Galvánica", correct: false },
                { text: "Corrosión por Grieta (Crevice)", correct: false }
              ]
            },
            {
              id: 2,
              x: 480, y: 340, width: 110, height: 80,
              name: "Zona de soldadura",
              type: "galvanica",
              image: "https://picsum.photos/id/201/800/500",
              description: "Daño cerca de la unión de dos metales diferentes.",
              options: [
                { text: "Corrosión Uniforme", correct: false },
                { text: "Pitting", correct: false },
                { text: "Corrosión Galvánica", correct: true },
                { text: "Corrosión por Grieta (Crevice)", correct: false }
              ]
            },
            {
              id: 3,
              x: 180, y: 420, width: 90, height: 70,
              name: "Área con grieta",
              type: "crevice",
              image: "https://picsum.photos/id/866/800/500",
              description: "Daño concentrado en una junta o grieta.",
              options: [
                { text: "Corrosión Uniforme", correct: false },
                { text: "Pitting", correct: false },
                { text: "Corrosión Galvánica", correct: false },
                { text: "Corrosión por Grieta (Crevice)", correct: true }
              ]
            }
          ]
        }
      ]
    };

    // ==================== CLASE DEL JUEGO (Phaser) ====================
    class CorrosionGame extends Phaser.Scene {
      constructor() {
        super({ key: 'CorrosionGame' });
      }

      create() {
        this.level = gameData.levels.find(l => l.id === gameData.currentLevel);
        this.cameras.main.setBackgroundColor(this.level.background);

        this.add.text(50, 60, this.level.name, { 
          fontSize: '32px', 
          color: '#00ff9d',
          fontStyle: 'bold'
        }).setShadow(3, 3, '#000', 6);

        this.areas = [];
        this.level.areas.forEach(area => {
          const rect = this.add.rectangle(area.x, area.y, area.width, area.height, 0xffaa00, 0.25)
            .setInteractive()
            .setStrokeStyle(4, 0xff0000);

          rect.areaData = area;

          rect.on('pointerdown', () => this.inspectArea(area));
          this.areas.push(rect);
        });

        this.updateHUD();
      }

      inspectArea(area) {
        document.getElementById('modal-title').textContent = `Inspección: ${area.name}`;
        document.getElementById('corrosion-image').src = area.image;
        document.getElementById('modal-description').textContent = area.description;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        area.options.forEach(option => {
          const btn = document.createElement('button');
          btn.textContent = option.text;
          btn.onclick = () => this.checkAnswer(option, area);
          container.appendChild(btn);
        });

        document.getElementById('inspection-modal').style.display = 'flex';
      }

      checkAnswer(option, area) {
        if (option.correct) {
          alert("✅ ¡Correcto! Excelente trabajo inspector.");
          gameData.money += 350;
        } else {
          alert("❌ Incorrecto. Era " + area.type.toUpperCase());
          gameData.strikes++;
          gameData.money -= 250;

          if (gameData.strikes >= this.level.maxStrikes) {
            alert("💥 Demasiados errores. Nivel fallado.");
            gameData.strikes = 0;
            gameData.money = Math.max(500, gameData.money);
          }
        }
        
        this.updateHUD();
        document.getElementById('inspection-modal').style.display = 'none';
      }

      updateHUD() {
        document.getElementById('money').textContent = gameData.money;
        document.getElementById('level').textContent = gameData.currentLevel;
        document.getElementById('strikes').textContent = gameData.strikes;
      }
    }

    // ==================== INICIO DEL JUEGO ====================
    let game;

    window.onload = function() {
      const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight - 10,
        parent: 'game-container',
        scene: CorrosionGame,
        physics: { default: 'arcade' }
      };

      game = new Phaser.Game(config);

      // Botones
      document.getElementById('reset-btn').addEventListener('click', () => {
        if (confirm("¿Reiniciar el nivel actual?")) {
          gameData.strikes = 0;
          game.scene.restart();
        }
      });

      document.getElementById('close-modal').addEventListener('click', () => {
        document.getElementById('inspection-modal').style.display = 'none';
      });
    };
  </script>
</body>
</html>
