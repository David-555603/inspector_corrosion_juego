<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorroPac: Industrial Maze</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    body { margin:0; background:#000; color:#00ff9d; font-family: 'Courier New', monospace; overflow:hidden; }
    #ui {
      position: absolute; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10,20,40,0.9); padding: 10px; text-align: center; border-bottom: 2px solid #00ff9d;
    }
    #hud { font-size: 1.2em; display: flex; justify-content: center; gap: 20px; }
    .modal {
      display:none; position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.9); z-index:200; align-items:center; justify-content:center;
    }
    .modal-content {
      background:#0a1f2f; padding:20px; border-radius:10px; max-width:500px; width:90%;
      border:3px solid #00ff9d; text-align:center;
    }
    #corrosion-image { width:100%; border-radius:8px; border:2px solid #555; }
    .opt-btn {
      width:100%; padding:12px; margin:8px 0; background:#1a2a44; border:2px solid #00ff9d; color:#00ff9d;
      cursor:pointer; font-weight:bold;
    }
    .opt-btn:hover { background:#00ff9d; color:#000; }
  </style>
</head>
<body>

<div id="ui">
  <div id="hud">
    <span>💰 $<span id="money">1500</span></span>
    <span>🏭 Nivel: <span id="level">1</span></span>
    <span>⚠️ Strikes: <span id="strikes">0</span>/4</span>
  </div>
</div>

<div id="inspection-modal" class="modal">
  <div class="modal-content">
    <h2 id="modal-title">⚠️ REPORTE DE DAÑO</h2>
    <img id="corrosion-image" src="">
    <p id="modal-description"></p>
    <div id="options-container"></div>
  </div>
</div>

<script>
    const gameData = {
        money: 1500, strikes: 0, level: 1, isPaused: false,
        levels: [
            { defects: 3, speed: 180, enemySpeed: 100, color: 0x00ff88 },
            { defects: 5, speed: 200, enemySpeed: 130, color: 0x00ccff },
            { defects: 7, speed: 220, enemySpeed: 160, color: 0xff0055 }
        ]
    };

    class CorroPac extends Phaser.Scene {
        constructor() { super('CorroPac'); }

        preload() {
            // Aquí podrías cargar imágenes reales de tus carpetas si quisieras
        }

        create() {
            const config = gameData.levels[gameData.level - 1];
            
            // Laberinto Industrial (Paredes sólidas)
            this.walls = this.physics.add.staticGroup();
            this.createMaze();

            // Jugador
            this.player = this.add.circle(50, 80, 15, 0xffff00);
            this.physics.add.existing(this.player);
            this.player.body.setCollideWorldBounds(true);
            
            // Colisión Jugador <-> Paredes
            this.physics.add.collider(this.player, this.walls);

            // Enemigos (Pepas de Corrosión)
            this.enemies = this.physics.add.group();
            for(let i=0; i < config.defects; i++) {
                let x = Phaser.Math.Between(200, window.innerWidth - 50);
                let y = Phaser.Math.Between(200, window.innerHeight - 50);
                let enemy = this.add.circle(x, y, 12, 0xff0000);
                this.physics.add.existing(enemy);
                enemy.body.setCollideWorldBounds(true);
                enemy.body.setBounce(1);
                enemy.defData = this.getRandomDefect();
                this.enemies.add(enemy);
            }

            // Colisión Enemigos <-> Paredes
            this.physics.add.collider(this.enemies, this.walls);

            // IMPACTO: Jugador contra Pepa
            this.physics.add.overlap(this.player, this.enemies, this.hitEnemy, null, this);

            this.cursors = this.input.keyboard.createCursorKeys();
        }

        createMaze() {
            // Dibujamos un laberinto tipo tuberías
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            // Marcos
            const wallColor = 0x334155;
            const data = [
                [w/2, 150, w*0.8, 20], // Horizontal superior
                [200, h/2, 20, h*0.6], // Vertical izquierda
                [w-200, h/2, 20, h*0.6], // Vertical derecha
                [w/2, h-100, w*0.5, 20], // Horizontal inferior
                [w/2, h/2, 150, 20], // Centro
                [400, 300, 20, 150]  // Obstáculo extra
            ];

            data.forEach(pos => {
                let rect = this.add.rectangle(pos[0], pos[1], pos[2], pos[3], wallColor);
                this.walls.add(rect);
            });
        }

        getRandomDefect() {
            const types = [
                {type:"uniforme", img:"https://picsum.photos/id/1015/400/250", desc:"Ataque en toda la superficie expuesta."},
                {type:"pitting", img:"https://picsum.photos/id/201/400/250", desc:"Cavidades pequeñas pero muy profundas."},
                {type:"galvanica", img:"https://picsum.photos/id/866/400/250", desc:"Ocurre por contacto de dos metales distintos."},
                {type:"erosion", img:"https://picsum.photos/id/1016/400/250", desc:"Daño por alta turbulencia de fluido."}
            ];
            return types[Math.floor(Math.random()*types.length)];
        }

        update() {
            if (gameData.isPaused) {
                this.player.body.setVelocity(0);
                this.enemies.children.iterate(e => e.body.setVelocity(0));
                return;
            }

            const speed = gameData.levels[gameData.level-1].speed;
            const enemySpeed = gameData.levels[gameData.level-1].enemySpeed;

            // Movimiento Jugador
            this.player.body.setVelocity(0);
            if (this.cursors.left.isDown) this.player.body.setVelocityX(-speed);
            else if (this.cursors.right.isDown) this.player.body.setVelocityX(speed);
            
            if (this.cursors.up.isDown) this.player.body.setVelocityY(-speed);
            else if (this.cursors.down.isDown) this.player.body.setVelocityY(speed);

            // Enemigos persiguen
            this.enemies.children.iterate(enemy => {
                this.physics.moveToObject(enemy, this.player, enemySpeed);
            });
        }

        hitEnemy(player, enemy) {
            gameData.isPaused = true;
            this.showModal(enemy);
        }

        showModal(enemy) {
            const def = enemy.defData;
            const modal = document.getElementById('inspection-modal');
            document.getElementById('corrosion-image').src = def.img;
            document.getElementById('modal-description').textContent = def.desc;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const options = ["Uniforme", "Pitting", "Galvanica", "Erosion"];
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.textContent = opt;
                btn.onclick = () => {
                    if(opt.toLowerCase() === def.type) {
                        alert("✅ ¡CORRECTO!");
                        gameData.money += 500;
                        enemy.destroy();
                    } else {
                        alert("❌ ¡INCORRECTO!");
                        gameData.strikes++;
                        gameData.money -= 200;
                    }
                    this.closeModal();
                };
                container.appendChild(btn);
            });
            modal.style.display = 'flex';
        }

        closeModal() {
            document.getElementById('inspection-modal').style.display = 'none';
            gameData.isPaused = false;
            this.updateHUD();
            
            if(gameData.strikes >= 4) {
                alert("GAME OVER - Planta Colapsada");
                location.reload();
            }
            if(this.enemies.countActive() === 0) {
                alert("Nivel Superado 🏭");
                gameData.level++;
                this.scene.restart();
            }
        }

        updateHUD() {
            document.getElementById('money').textContent = gameData.money;
            document.getElementById('level').textContent = gameData.level;
            document.getElementById('strikes').textContent = gameData.strikes;
        }
    }

    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        parent: 'game-container',
        physics: { default: 'arcade', arcade: { debug: false } },
        scene: CorroPac
    };

    new Phaser.Game(config);
</script>
</body>
</html>
