<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorroDetective - Inspector de Corrosión</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a1f2f;
      color: #00ff9d;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(10, 31, 47, 0.95);
      padding: 10px 20px;
      text-align: center;
      border-bottom: 3px solid #00ff9d;
    }
    h1 { font-size: 2.5em; text-shadow: 0 0 15px #00ff9d; }
    #hud { display: flex; justify-content: center; gap: 40px; font-size: 1.35em; margin: 8px 0; }
    button { background:#006633; color:white; border:none; padding:10px 20px; margin:5px; border-radius:6px; cursor:pointer; }
    button:hover { background:#00ff9d; color:#000; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #112233;
      padding: 25px;
      border-radius: 12px;
      max-width: 720px;
      width: 90%;
      border: 3px solid #00ff9d;
      text-align: center;
    }
    #corrosion-image { width:100%; max-height:340px; border-radius:8px; margin:12px 0; }
    #options-container button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 15px;
      font-size: 1.15em;
      background: #223344;
      border: 2px solid #00cc88;
      color: #00ff9d;
    }
    #options-container button:hover { background: #00aa77; }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <h1>🔧 CorroDetective</h1>
    <div id="hud">
      <span>Dinero: $<span id="money">1500</span></span>
      <span>Nivel: <span id="level">1</span></span>
      <span>Strikes: <span id="strikes">0</span>/3</span>
    </div>
    <button id="reset-btn">Reiniciar Nivel</button>
  </div>

  <div id="game-container"></div>

  <!-- Modal -->
  <div id="inspection-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">Inspección en curso...</h2>
      <img id="corrosion-image" src="" alt="Corrosión">
      <p id="modal-description" style="margin:15px 0; font-size:1.1em;"></p>
      <div id="options-container"></div>
      <button id="close-modal" style="margin-top:15px;">Cerrar</button>
    </div>
  </div>

  <script>
    const gameData = {
      currentLevel: 1,
      money: 1500,
      strikes: 0,
      levels: [{
        id: 1,
        name: "Tanque de Almacenamiento",
        background: "#1a3c2f",
        maxStrikes: 3,
        areas: [
          { id:1, x:280, y:220, width:160, height:100, name:"Base del tanque", type:"uniforme",
            image:"https://picsum.photos/id/1015/800/500",
            description:"Daño generalizado en toda la superficie.",
            options:[
              {text:"Corrosión Uniforme", correct:true},
              {text:"Pitting", correct:false},
              {text:"Corrosión Galvánica", correct:false},
              {text:"Corrosión por Grieta", correct:false}
            ]
          },
          { id:2, x:520, y:280, width:130, height:90, name:"Zona de soldadura", type:"galvanica",
            image:"https://picsum.photos/id/201/800/500",
            description:"Corrosión cerca de la unión de metales diferentes.",
            options:[
              {text:"Corrosión Uniforme", correct:false},
              {text:"Pitting", correct:false},
              {text:"Corrosión Galvánica", correct:true},
              {text:"Corrosión por Grieta", correct:false}
            ]
          }
        ]
      }]
    };

    class CorrosionGame extends Phaser.Scene {
      constructor() { super({ key: 'CorrosionGame' }); }

      create() {
        const level = gameData.levels[0];
        this.cameras.main.setBackgroundColor(level.background);

        this.add.text(40, 70, level.name, { fontSize: '34px', color: '#00ff9d', fontStyle: 'bold' })
          .setShadow(4, 4, '#000', 8);

        level.areas.forEach(area => {
          const rect = this.add.rectangle(area.x, area.y, area.width, area.height, 0xffee00, 0.3)
            .setInteractive({ useHandCursor: true })
            .setStrokeStyle(5, 0xff0000);

          rect.areaData = area;

          rect.on('pointerdown', () => this.inspectArea(area));
        });

        this.updateHUD();
      }

      inspectArea(area) {
        document.getElementById('modal-title').textContent = `Inspección: ${area.name}`;
        document.getElementById('corrosion-image').src = area.image;
        document.getElementById('modal-description').textContent = area.description;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        area.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.textContent = opt.text;
          btn.onclick = () => this.checkAnswer(opt, area);
          container.appendChild(btn);
        });

        document.getElementById('inspection-modal').style.display = 'flex';
      }

      checkAnswer(option, area) {
        if (option.correct) {
          alert("✅ ¡Muy bien! Identificaste correctamente la corrosión.");
          gameData.money += 400;
        } else {
          alert(`❌ Incorrecto. Era: ${area.type.toUpperCase()}`);
          gameData.strikes++;
          gameData.money = Math.max(200, gameData.money - 300);

          if (gameData.strikes >= gameData.levels[0].maxStrikes) {
            alert("💥 Has fallado el nivel. Demasiados errores.");
            gameData.strikes = 0;
          }
        }
        this.updateHUD();
        document.getElementById('inspection-modal').style.display = 'none';
      }

      updateHUD() {
        document.getElementById('money').textContent = gameData.money;
        document.getElementById('strikes').textContent = gameData.strikes;
      }
    }

    // Iniciar juego
    window.onload = () => {
      const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight - 5,
        parent: 'game-container',
        scene: CorrosionGame
      };

      new Phaser.Game(config);

      document.getElementById('reset-btn').onclick = () => {
        if (confirm("¿Reiniciar nivel?")) location.reload();
      };

      document.getElementById('close-modal').onclick = () => {
        document.getElementById('inspection-modal').style.display = 'none';
      };
    };
  </script>
</body>
</html>
