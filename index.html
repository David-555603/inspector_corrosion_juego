<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorroDetective - Inspector de Corrosión</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    body { margin:0; background:#000; color:#00ff9d; font-family: 'Segoe UI', sans-serif; overflow:hidden; }
    #ui-overlay {
      position: absolute; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10,20,40,0.95); padding: 10px; text-align:center; border-bottom: 3px solid #00ff9d;
    }
    h1 { margin:0; font-size:2.6em; text-shadow: 0 0 20px #00ff9d; }
    #hud { font-size:1.4em; margin:8px 0; }
    button { padding:10px 20px; font-size:1.1em; background:#006633; color:white; border:none; border-radius:8px; cursor:pointer; }
    button:hover { background:#00ff9d; color:black; }

    .modal {
      display:none; position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.95); z-index:200; align-items:center; justify-content:center;
    }
    .modal-content {
      background:#0f1f33; padding:25px; border-radius:15px; max-width:750px; width:92%;
      border:4px solid #00ff9d; text-align:center;
    }
    #corrosion-image { width:100%; max-height:380px; border-radius:10px; margin:15px 0; border:2px solid #555; }
    #options-container button {
      width:100%; padding:16px; margin:10px 0; font-size:1.2em; background:#1a2a44; border:2px solid #00cc88; color:#00ff9d;
    }
    #options-container button:hover { background:#00aa77; }
  </style>
</head>
<body>
  <div id="ui-overlay">
    <h1>🔧 CorroDetective</h1>
    <div id="hud">Dinero: $<span id="money">1500</span> | Nivel: <span id="level">1</span> | Strikes: <span id="strikes">0</span>/3</div>
    <button id="reset-btn">Reiniciar Nivel</button>
  </div>

  <div id="game-container"></div>

  <!-- Modal -->
  <div id="inspection-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <img id="corrosion-image" src="" alt="Corrosión">
      <p id="modal-description" style="font-size:1.15em; margin:15px 0;"></p>
      <div id="options-container"></div>
      <button id="close-modal" style="margin-top:15px;">Cerrar</button>
    </div>
  </div>

  <script>
    const gameData = {
      money: 1500,
      strikes: 0,
      level: 1,
      levels: [{
        id: 1,
        name: "Tanque de Almacenamiento - Nivel 1",
        background: "#0a1f1a",
        bgImage: "https://picsum.photos/id/1015/1920/1080",
        areas: [
          { x:320, y:280, w:150, h:110, name:"Base del Tanque", type:"uniforme",
            image:"https://picsum.photos/id/1015/800/500",
            desc:"Daño uniforme en toda la superficie inferior.",
            options: [
              {text:"Corrosión Uniforme", correct:true},
              {text:"Pitting", correct:false},
              {text:"Corrosión Galvánica", correct:false},
              {text:"Corrosión por Grieta", correct:false}
            ]
          },
          { x:580, y:420, w:140, h:95, name:"Zona de Soldadura", type:"galvanica",
            image:"https://picsum.photos/id/201/800/500",
            desc:"Corrosión acelerada cerca de la unión de metales.",
            options: [
              {text:"Corrosión Uniforme", correct:false},
              {text:"Pitting", correct:false},
              {text:"Corrosión Galvánica", correct:true},
              {text:"Corrosión por Grieta", correct:false}
            ]
          },
          { x:180, y:480, w:120, h:85, name:"Junta Superior", type:"crevice",
            image:"https://picsum.photos/id/866/800/500",
            desc:"Daño concentrado en una grieta o junta.",
            options: [
              {text:"Corrosión Uniforme", correct:false},
              {text:"Pitting", correct:false},
              {text:"Corrosión Galvánica", correct:false},
              {text:"Corrosión por Grieta", correct:true}
            ]
          }
        ]
      }]
    };

    class CorrosionGame extends Phaser.Scene {
      constructor() { super('CorrosionGame'); }

      create() {
        // Fondo
        this.add.image(window.innerWidth/2, window.innerHeight/2, 'background').setDisplaySize(window.innerWidth, window.innerHeight);
        
        this.add.text(50, 80, gameData.levels[0].name, {fontSize:'28px', color:'#00ff9d', fontStyle:'bold'}).setShadow(3,3,'#000',5);

        gameData.levels[0].areas.forEach(area => {
          const rect = this.add.rectangle(area.x, area.y, area.w, area.h, 0xffaa00, 0.35)
            .setInteractive({useHandCursor:true})
            .setStrokeStyle(6, 0xff0000);

          rect.areaData = area;

          rect.on('pointerover', () => rect.setAlpha(0.8));
          rect.on('pointerout', () => rect.setAlpha(1));
          rect.on('pointerdown', () => this.inspectArea(area));
        });

        this.updateHUD();
      }

      inspectArea(area) {
        document.getElementById('modal-title').innerHTML = `🔍 Inspección: <b>${area.name}</b>`;
        document.getElementById('corrosion-image').src = area.image;
        document.getElementById('modal-description').textContent = area.desc;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        area.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.textContent = opt.text;
          btn.onclick = () => this.checkAnswer(opt, area);
          container.appendChild(btn);
        });

        document.getElementById('inspection-modal').style.display = 'flex';
      }

      checkAnswer(option, area) {
        const modal = document.getElementById('inspection-modal');
        
        if (option.correct) {
          alert("✅ ¡Excelente! Identificación correcta.");
          gameData.money += 450;
          this.showBossMessage("Buen trabajo inspector, sigues así y te subo el bono.");
        } else {
          alert(`❌ Error. Era: ${area.type.toUpperCase()}`);
          gameData.strikes++;
          gameData.money -= 320;
          this.showBossMessage("¿Otra vez? ¡Concéntrate o me vas a arruinar la planta!");
        }

        this.updateHUD();
        modal.style.display = 'none';

        if (gameData.strikes >= 3) {
          alert("💥 NIVEL FALLADO - Demasiados errores. El Jefe está decepcionado.");
          gameData.strikes = 0;
          gameData.money = 800;
        }
      }

      showBossMessage(msg) {
        setTimeout(() => alert("👔 Jefe: " + msg), 300);
      }

      updateHUD() {
        document.getElementById('money').textContent = gameData.money;
        document.getElementById('strikes').textContent = gameData.strikes;
      }
    }

    // Iniciar juego
    window.onload = () => {
      const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        parent: 'game-container',
        scene: CorrosionGame,
        physics: { default: 'arcade' }
      };

      const game = new Phaser.Game(config);

      // Precargar fondo
      game.scene.scenes[0].load.image('background', 'https://picsum.photos/id/1015/1920/1080');

      document.getElementById('reset-btn').onclick = () => location.reload();
      document.getElementById('close-modal').onclick = () => document.getElementById('inspection-modal').style.display = 'none';

      alert("¡Bienvenido a CorroDetective!\n\nBusca los rectángulos rojos en la planta y haz clic para inspeccionar.");
    };
  </script>
</body>
</html>
