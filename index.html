<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CorroPac: Industrial Trilogy</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    body { margin:0; background:#000; overflow:hidden; touch-action: none; font-family: 'Courier New', monospace; }
    #ui {
      position: absolute; top: 0; width: 100%; z-index: 100;
      background: rgba(0, 0, 0, 0.9); border-bottom: 2px solid #0055ff;
      padding: 5px 0; color: #fff; text-align: center;
    }
    #hud { display: flex; justify-content: center; gap: 15px; font-weight: bold; font-size: 14px; }
    .modal {
      display:none; position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.95); z-index:2000; align-items:center; justify-content:center;
    }
    .modal-content {
      background:#000; padding:15px; border-radius:10px; width:80%; max-width:350px;
      border:3px solid #00ff00; text-align:center; box-shadow: 0 0 20px #0055ff;
    }
    #corrosion-image { width:100%; border-radius:5px; margin: 10px 0; border: 1px solid #444; }
    .opt-btn {
      width:100%; padding:12px; margin:5px 0; background:#001133; border:2px solid #00ff00; color:#00ff00;
      font-weight: bold; border-radius: 5px; font-size: 14px; cursor: pointer;
    }
    #mobile-controls { position: fixed; bottom: 10px; width: 100%; display: flex; justify-content: center; z-index: 150; }
    .d-pad { display: grid; grid-template-columns: 65px 65px 65px; gap: 5px; }
    .joy-btn {
      width: 60px; height: 60px; background: rgba(0, 85, 255, 0.3);
      border: 2px solid #0055ff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #fff; touch-action: none;
    }
  </style>
</head>
<body>

<div id="ui">
  <div id="hud">
    <span>❤️ <span id="lives">❤️❤️❤️</span></span>
    <span>🔧 <span id="tools-count">0</span>/10</span>
    <span>🏭 LVL: <span id="level">1</span></span>
  </div>
</div>

<div id="inspection-modal" class="modal">
  <div class="modal-content">
    <h3 style="margin:0; color: #00ff00;">ANALIZANDO FALLA</h3>
    <img id="corrosion-image" src="">
    <p id="modal-description" style="color: #ccc; font-size: 12px;"></p>
    <div id="options-container"></div>
  </div>
</div>

<div id="mobile-controls">
  <div class="d-pad">
    <div></div><div class="joy-btn" id="up">▲</div><div></div>
    <div class="joy-btn" id="left">◀</div><div class="joy-btn" id="down">▼</div><div class="joy-btn" id="right">▶</div>
  </div>
</div>

<script>
    const gameData = {
        lives: 3, level: 1, isPaused: false, toolsCollected: 0,
        input: { up: false, down: false, left: false, right: false },
        levels: [
            { speed: 170, enemySpeed: 60, enemyCount: 3 }, // Nivel 1
            { speed: 190, enemySpeed: 80, enemyCount: 5 }, // Nivel 2
            { speed: 210, enemySpeed: 110, enemyCount: 8 } // Nivel 3 (EL DESAFÍO)
        ]
    };

    class CorroPac extends Phaser.Scene {
        constructor() { super('CorroPac'); }

        create() {
            const w = this.cameras.main.width;
            const h = this.cameras.main.height;
            gameData.toolsCollected = 0;
            const config = gameData.levels[gameData.level - 1];
            
            document.getElementById('level').textContent = gameData.level;
            document.getElementById('tools-count').textContent = "0";

            this.walls = this.physics.add.staticGroup();
            this.createLevelMaze(w, h);

            // Inspector (Spawn central inferior para seguridad)
            this.player = this.add.container(w/2, h-220);
            this.player.add([this.add.circle(0, 0, 12, 0xffff00), this.add.text(-10, -15, '👷', {fontSize:'18px'})]);
            this.physics.add.existing(this.player);
            this.player.body.setCircle(12, -12, -12).setCollideWorldBounds(true);
            this.physics.add.collider(this.player, this.walls);

            // Herramientas (10 llaves esparcidas por toda la pista)
            this.tools = this.physics.add.group();
            const spots = this.getToolSpots(w, h);
            spots.forEach(pos => {
                let t = this.add.text(pos.x, pos.y, '🔧', {fontSize:'22px'});
                this.physics.add.existing(t);
                this.tools.add(t);
            });

            this.physics.add.overlap(this.player, this.tools, (p, t) => {
                t.destroy();
                gameData.toolsCollected++;
                document.getElementById('tools-count').textContent = gameData.toolsCollected;
                this.checkWinCondition();
            }, null, this);

            // Enemigos (Aparecen al tiempo en las esquinas)
            this.enemies = this.physics.add.group();
            const spawns = [{x: 50, y: 110}, {x: w-50, y: 110}, {x: 50, y: h-230}, {x: w-50, y: h-230}, {x: w/2, y: 110}];
            for(let i=0; i < config.enemyCount; i++) {
                let p = spawns[i % spawns.length];
                let e = this.add.container(p.x, p.y);
                e.add(this.add.text(-12, -12, '⚠️', {fontSize:'24px'}));
                this.physics.add.existing(e);
                e.body.setCircle(12, -12, -12).setCollideWorldBounds(true).setBounce(1);
                e.defData = this.getRandomDefect();
                this.enemies.add(e);
            }
            this.physics.add.collider(this.enemies, this.walls);
            this.physics.add.overlap(this.player, this.enemies, this.hitEnemy, null, this);

            // Controles
            const setup = (id, k) => {
                const b = document.getElementById(id);
                b.onpointerdown = (ev) => { ev.preventDefault(); gameData.input[k] = true; };
                b.onpointerup = () => gameData.input[k] = false;
                b.onpointerout = () => gameData.input[k] = false;
            };
            ['up','down','left','right'].forEach(k => setup(k, k));
        }

        createLevelMaze(w, h) {
            const wallColor = 0x0055ff;
            const drawRect = (x, y, width, height) => {
                this.walls.add(this.add.rectangle(x, y, width, height, wallColor).setStrokeStyle(2, 0x00ffff, 0.5));
            };

            // Bordes Universales
            drawRect(w/2, 70, w, 10);
            drawRect(w/2, h-180, w, 10);

            if(gameData.level === 1) {
                // Nivel 1: Pasillos Horizontales
                drawRect(w/2, 180, w*0.7, 15);
                drawRect(w/4, h/2 - 20, 15, 120);
                drawRect(w*0.75, h/2 - 20, 15, 120);
            } else if (gameData.level === 2) {
                // Nivel 2: Pasillos Verticales
                drawRect(w/2, h/2 - 50, 20, h*0.5);
                drawRect(w/4, 150, w/3, 15);
                drawRect(w*0.75, 150, w/3, 15);
                drawRect(w/2, h-280, w*0.5, 15);
            } else {
                // NIVEL 3: EL LABERINTO COMPLEJO (Tubería densa)
                drawRect(w/2, 160, 20, 120); // Cruz central sup
                drawRect(w/2, 160, w*0.8, 15);
                
                drawRect(w/4, 300, 15, 200); // Laberinto lateral izq
                drawRect(w*0.75, 300, 15, 200); // Laberinto lateral der
                
                drawRect(w/2, h/2 + 50, w*0.6, 15); // Divisor central
                drawRect(w/2, h-320, 15, 100); // Obstáculo final
                
                // Bloques de esquina
                drawRect(80, 240, 60, 15);
                drawRect(w-80, 240, 60, 15);
            }
        }

        getToolSpots(w, h) {
            // Repartidas para forzar el recorrido total
            return [
                {x: 40, y: 100}, {x: w-40, y: 100}, {x: w/2, y: 220},
                {x: 40, y: h/2}, {x: w-40, y: h/2}, {x: 40, y: h-230},
                {x: w-40, y: h-230}, {x: w/2, y: h/2 + 100}, {x: w/4, y: 150}, {x: 3*w/4, y: 150}
            ];
        }

        getRandomDefect() {
            return [
                {type:"uniforme", img:"https://picsum.photos/id/1015/300/200", desc:"Deterioro uniforme del material."},
                {type:"pitting", img:"https://picsum.photos/id/201/300/200", desc:"Picaduras profundas críticas."},
                {type:"galvánica", img:"https://picsum.photos/id/866/300/200", desc:"Corrosión por contacto bimetálico."},
                {type:"erosión", img:"https://picsum.photos/id/1016/300/200", desc:"Falla por fricción de fluidos."}
            ][Math.floor(Math.random()*4)];
        }

        update() {
            if (gameData.isPaused) { this.player.body.setVelocity(0); return; }
            const config = gameData.levels[gameData.level-1];
            this.player.body.setVelocity(0);
            if (gameData.input.left) this.player.body.setVelocityX(-config.speed);
            else if (gameData.input.right) this.player.body.setVelocityX(config.speed);
            if (gameData.input.up) this.player.body.setVelocityY(-config.speed);
            else if (gameData.input.down) this.player.body.setVelocityY(config.speed);

            this.enemies.children.iterate(e => {
                if(e && e.active) this.physics.moveToObject(e, this.player, config.enemySpeed);
            });
        }

        hitEnemy(p, e) {
            if (gameData.isPaused) return;
            gameData.isPaused = true;
            const def = e.defData;
            document.getElementById('corrosion-image').src = def.img;
            document.getElementById('modal-description').textContent = def.desc;
            const cont = document.getElementById('options-container');
            cont.innerHTML = '';
            ["Uniforme", "Pitting", "Galvánica", "Erosión"].forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn'; btn.textContent = opt;
                btn.onclick = () => {
                    if(opt.toLowerCase() === def.type.toLowerCase()) { e.destroy(); }
                    else { gameData.lives--; }
                    document.getElementById('inspection-modal').style.display = 'none';
                    this.checkWinCondition();
                };
                cont.appendChild(btn);
            });
            document.getElementById('inspection-modal').style.display = 'flex';
        }

        checkWinCondition() {
            document.getElementById('lives').textContent = "❤️".repeat(gameData.lives);
            if(gameData.lives <= 0) { alert("SISTEMA COLAPSADO: FIN DEL JUEGO"); location.reload(); return; }
            
            gameData.isPaused = false;
            if(this.enemies.countActive() === 0 && gameData.toolsCollected >= 10) {
                if(gameData.level < 3) {
                    gameData.level++;
                    alert("¡NIVEL SUPERADO! Prepárate para el siguiente sector.");
                    this.scene.restart();
                } else {
                    alert("¡FELICITACIONES! Has completado la inspección total de la planta.");
                    location.reload();
                }
            }
        }
    }

    new Phaser.Game({
        type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight,
        parent: 'game-container', backgroundColor: '#000',
        physics: { default: 'arcade' }, scene: CorroPac
    });
</script>
</body>
</html>
