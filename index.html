<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CorroPac: Arcade Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    body { margin:0; background:#000; overflow:hidden; touch-action: none; font-family: 'Courier New', Courier, monospace; }
    #ui {
      position: absolute; top: 0; width: 100%; z-index: 100;
      background: rgba(0, 0, 0, 0.8); border-bottom: 2px solid #2222ff;
      padding: 10px 0; color: #fff; text-align: center;
    }
    #hud { display: flex; justify-content: center; gap: 20px; font-weight: bold; font-size: 14px; }
    .life { color: #ff0000; }
    
    /* MODAL ESTILO RETRO */
    .modal {
      display:none; position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.9); z-index:2000; align-items:center; justify-content:center;
    }
    .modal-content {
      background:#000; padding:20px; border-radius:5px; width:85%; max-width:400px;
      border:3px solid #2222ff; text-align:center; box-shadow: 0 0 20px #2222ff;
    }
    #corrosion-image { width:100%; border:2px solid #444; margin: 10px 0; }
    .opt-btn {
      width:100%; padding:12px; margin:5px 0; background:#000; border:1px solid #00ff00; color:#00ff00;
      font-family: inherit; font-size: 14px; cursor: pointer;
    }
    .opt-btn:active { background: #00ff00; color: #000; }

    /* CONTROLES */
    #mobile-controls { position: fixed; bottom: 15px; width: 100%; display: flex; justify-content: center; z-index: 150; }
    .d-pad { display: grid; grid-template-columns: 60px 60px 60px; gap: 8px; }
    .joy-btn {
      width: 60px; height: 60px; background: rgba(34, 34, 255, 0.2);
      border: 2px solid #2222ff; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #fff; user-select: none;
    }
  </style>
</head>
<body>

<div id="ui">
  <div id="hud">
    <span>CASH: $<span id="money">1500</span></span>
    <span>LIFE: <span id="lives">❤️❤️❤️</span></span>
    <span>LVL: <span id="level">1</span></span>
  </div>
</div>

<div id="inspection-modal" class="modal">
  <div class="modal-content">
    <h2 style="margin:0; color: #2222ff; font-size: 18px;">-- ANALYSIS REQUIRED --</h2>
    <img id="corrosion-image" src="">
    <p id="modal-description" style="font-size: 12px; color: #888;"></p>
    <div id="options-container"></div>
  </div>
</div>

<div id="mobile-controls">
  <div class="d-pad">
    <div></div><div class="joy-btn" id="up">▲</div><div></div>
    <div class="joy-btn" id="left">◀</div><div class="joy-btn" id="down">▼</div><div class="joy-btn" id="right">▶</div>
  </div>
</div>

<script>
    const gameData = {
        money: 1500, lives: 3, level: 1, isPaused: false,
        input: { up: false, down: false, left: false, right: false },
        levels: [
            { defects: 3, speed: 170, enemySpeed: 90 },
            { defects: 5, speed: 190, enemySpeed: 110 },
            { defects: 8, speed: 210, enemySpeed: 130 }
        ]
    };

    class CorroPac extends Phaser.Scene {
        constructor() { super('CorroPac'); }

        create() {
            const config = gameData.levels[gameData.level - 1];
            
            // Laberinto Neón Azul (Tipo Pac-Man)
            this.walls = this.physics.add.staticGroup();
            this.drawMaze();

            // Inspector
            this.player = this.add.container(40, 90);
            const pBody = this.add.circle(0, 0, 14, 0xffff00).setStrokeStyle(2, 0x2222ff);
            const pHead = this.add.text(-10, -18, '👷', {fontSize:'22px'});
            this.player.add([pBody, pHead]);
            this.physics.add.existing(this.player);
            this.player.body.setCircle(14, -14, -14).setCollideWorldBounds(true);
            this.physics.add.collider(this.player, this.walls);

            // Pepas (Enemigos)
            this.enemies = this.physics.add.group();
            for(let i=0; i < config.defects; i++) {
                let x = Phaser.Math.Between(100, window.innerWidth-50);
                let y = Phaser.Math.Between(150, window.innerHeight-200);
                let e = this.add.container(x, y);
                e.add(this.add.text(-12, -12, '⚠️', {fontSize:'24px'}));
                this.physics.add.existing(e);
                e.body.setCircle(12, -12, -12).setCollideWorldBounds(true).setBounce(1);
                e.defData = this.getRandomDefect();
                this.enemies.add(e);
            }

            this.physics.add.collider(this.enemies, this.walls);
            this.physics.add.overlap(this.player, this.enemies, this.hitEnemy, null, this);

            // Controles Táctiles
            const setup = (id, key) => {
                const btn = document.getElementById(id);
                btn.ontouchstart = (e) => { e.preventDefault(); gameData.input[key] = true; };
                btn.ontouchend = () => gameData.input[key] = false;
            };
            ['up','down','left','right'].forEach(k => setup(k, k));
        }

        drawMaze() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const wallColor = 0x2222ff; // Azul Neón

            const addWall = (x, y, width, height) => {
                const r = this.add.rectangle(x, y, width, height, wallColor);
                r.setStrokeStyle(2, 0xffffff, 0.5);
                this.walls.add(r);
            };

            // BORDES
            addWall(w/2, 60, w, 10); // Techo
            addWall(w/2, h-160, w, 10); // Piso (dejando espacio para controles)
            addWall(5, h/2, 10, h); // Pared Izq
            addWall(w-5, h/2, 10, h); // Pared Der

            // BLOQUES INTERNOS (Estilo Laberinto)
            addWall(w/2, 180, w*0.7, 10); // Viga central sup
            addWall(w/4, 300, 10, 150); // Vertical izq
            addWall(w*0.75, 300, 10, 150); // Vertical der
            addWall(w/2, 420, w*0.4, 10); // Viga central mid
            addWall(w/2, h/2 + 50, 10, 120); // Pilar central
        }

        getRandomDefect() {
            const types = [
                {type:"uniforme", img:"https://picsum.photos/id/1015/300/200", desc:"Ataque general en superficie de acero."},
                {type:"pitting", img:"https://picsum.photos/id/201/300/200", desc:"Picaduras por cloruros localizadas."},
                {type:"galvánica", img:"https://picsum.photos/id/866/300/200", desc:"Diferencia de potencial entre metales."},
                {type:"erosión", img:"https://picsum.photos/id/1016/300/200", desc:"Desgaste por flujo turbulento."}
            ];
            return types[Math.floor(Math.random()*types.length)];
        }

        update() {
            if (gameData.isPaused) { this.player.body.setVelocity(0); this.enemies.children.iterate(e=>{if(e.body) e.body.setVelocity(0)}); return; }
            
            const speed = gameData.levels[gameData.level-1].speed;
            this.player.body.setVelocity(0);
            if (gameData.input.left) this.player.body.setVelocityX(-speed);
            else if (gameData.input.right) this.player.body.setVelocityX(speed);
            if (gameData.input.up) this.player.body.setVelocityY(-speed);
            else if (gameData.input.down) this.player.body.setVelocityY(speed);

            this.enemies.children.iterate(e => { if(e.active) this.physics.moveToObject(e, this.player, gameData.levels[gameData.level-1].enemySpeed); });
        }

        hitEnemy(p, e) {
            if (gameData.isPaused) return;
            gameData.isPaused = true;
            const def = e.defData;
            document.getElementById('corrosion-image').src = def.img;
            document.getElementById('modal-description').textContent = def.desc;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            ["Uniforme", "Pitting", "Galvánica", "Erosión"].forEach(opt => {
                const b = document.createElement('button');
                b.className = 'opt-btn';
                b.textContent = opt;
                b.onclick = () => {
                    if(opt.toLowerCase() === def.type.toLowerCase()) { e.destroy(); gameData.money += 400; }
                    else { gameData.lives--; gameData.money -= 200; }
                    document.getElementById('inspection-modal').style.display = 'none';
                    this.refreshHUD();
                };
                container.appendChild(b);
            });
            document.getElementById('inspection-modal').style.display = 'flex';
        }

        refreshHUD() {
            document.getElementById('money').textContent = gameData.money;
            document.getElementById('lives').textContent = "❤️".repeat(gameData.lives);
            if(gameData.lives <= 0) { alert("SYSTEM OVERLOAD: GAME OVER"); location.reload(); }
            else { 
                gameData.isPaused = false; 
                if(this.enemies.countActive() === 0) { gameData.level++; alert("SECTOR SECURED"); this.scene.restart(); }
            }
        }
    }

    new Phaser.Game({
        type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight,
        parent: 'game-container', backgroundColor: '#000',
        physics: { default: 'arcade' }, scene: CorroPac
    });
</script>
</body>
</html>
