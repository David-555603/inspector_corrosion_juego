<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CorroPac: Maze Collector Fixed</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    body { margin:0; background:#000; overflow:hidden; touch-action: none; font-family: 'Courier New', monospace; }
    #ui {
      position: absolute; top: 0; width: 100%; z-index: 100;
      background: rgba(0, 0, 0, 0.9); border-bottom: 2px solid #0055ff;
      padding: 8px 0; color: #fff; text-align: center;
    }
    #hud { display: flex; justify-content: center; gap: 15px; font-weight: bold; font-size: 13px; }
    
    .modal {
      display:none; position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.95); z-index:2000; align-items:center; justify-content:center;
    }
    .modal-content {
      background:#000; padding:15px; border-radius:10px; width:80%; max-width:350px;
      border:3px solid #00ff00; text-align:center;
    }
    #corrosion-image { width:100%; border:2px solid #333; margin: 8px 0; }
    .opt-btn {
      width:100%; padding:10px; margin:4px 0; background:#001133; border:2px solid #00ff00; color:#00ff00;
      font-family: inherit; font-weight: bold; cursor: pointer; font-size: 12px;
    }

    #mobile-controls { position: fixed; bottom: 15px; width: 100%; display: flex; justify-content: center; z-index: 150; }
    .d-pad { display: grid; grid-template-columns: 60px 60px 60px; gap: 8px; }
    .joy-btn {
      width: 60px; height: 60px; background: rgba(0, 85, 255, 0.2);
      border: 2px solid #0055ff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff; user-select: none;
    }
  </style>
</head>
<body>

<div id="ui">
  <div id="hud">
    <span>❤️ <span id="lives">❤️❤️❤️</span></span>
    <span>🔧 <span id="tools-count">0</span>/10</span>
    <span>🏭 LVL: <span id="level">1</span></span>
  </div>
</div>

<div id="inspection-modal" class="modal">
  <div class="modal-content">
    <h3 style="margin:0; color: #00ff00;">-- ANALIZANDO FALLA --</h3>
    <img id="corrosion-image" src="">
    <p id="modal-description" style="color: #aaa; font-size: 11px;"></p>
    <div id="options-container"></div>
  </div>
</div>

<div id="mobile-controls">
  <div class="d-pad">
    <div></div><div class="joy-btn" id="up">▲</div><div></div>
    <div class="joy-btn" id="left">◀</div><div class="joy-btn" id="down">▼</div><div class="joy-btn" id="right">▶</div>
  </div>
</div>

<script>
    const gameData = {
        money: 1500, lives: 3, level: 1, isPaused: false, toolsCollected: 0,
        input: { up: false, down: false, left: false, right: false },
        levels: [
            { speed: 170, enemySpeed: 70, enemyCount: 3 },
            { speed: 190, enemySpeed: 90, enemyCount: 5 }
        ]
    };

    class CorroPac extends Phaser.Scene {
        constructor() { super('CorroPac'); }

        create() {
            const config = gameData.levels[gameData.level - 1];
            const w = window.innerWidth;
            const h = window.innerHeight;
            gameData.toolsCollected = 0;

            this.walls = this.physics.add.staticGroup();
            this.drawFixedMaze(w, h);

            // Inspector (Aparece en una zona segura y abierta)
            this.player = this.add.container(60, 110);
            this.player.add([this.add.circle(0, 0, 13, 0xffff00), this.add.text(-10, -16, '👷', {fontSize:'20px'})]);
            this.physics.add.existing(this.player);
            this.player.body.setCircle(13, -13, -13).setCollideWorldBounds(true);
            this.physics.add.collider(this.player, this.walls);

            // Herramientas (10 llaves por toda la pista, usando coordenadas seguras)
            this.tools = this.physics.add.group();
            const toolPositions = [
                {x: w-60, y: 110}, {x: w/2, y: 110}, {x: 60, y: h/2}, 
                {x: w-60, y: h/2}, {x: w/2, y: h/2 + 60}, {x: 100, y: h-220}, 
                {x: w-100, y: h-220}, {x: w/2 - 60, y: 220}, {x: w/2 + 60, y: 220}, {x: w/2, y: h-220}
            ];
            toolPositions.forEach(p => {
                let tool = this.add.text(p.x, p.y, '🔧', {fontSize:'20px'});
                this.physics.add.existing(tool);
                this.tools.add(tool);
            });

            this.physics.add.overlap(this.player, this.tools, (p, t) => {
                t.destroy();
                gameData.toolsCollected++;
                document.getElementById('tools-count').textContent = gameData.toolsCollected;
                if(gameData.toolsCollected >= 10) alert("¡Todas las herramientas recogidas! Elimina los fallos para avanzar.");
            }, null, this);

            // Enemigos (Fallas)
            this.enemies = this.physics.add.group();
            const spawns = [{x:w-50, y:120}, {x:50, y:h-250}, {x:w-50, y:h-250}, {x:w/2, y:h/2}];
            for(let i=0; i<config.enemyCount; i++){
                let p = spawns[i % spawns.length];
                let e = this.add.container(p.x, p.y);
                e.add(this.add.text(-12, -12, '⚠️', {fontSize:'22px'}));
                this.physics.add.existing(e);
                e.body.setCircle(12, -12, -12).setCollideWorldBounds(true).setBounce(1);
                e.defData = this.getRandomDefect();
                this.enemies.add(e);
            }
            this.physics.add.collider(this.enemies, this.walls);
            this.physics.add.overlap(this.player, this.enemies, this.hitEnemy, null, this);

            // Controles Táctiles
            const setup = (id, k) => {
                const b = document.getElementById(id);
                b.ontouchstart = (e) => { e.preventDefault(); gameData.input[k] = true; };
                b.ontouchend = () => gameData.input[k] = false;
            };
            ['up','down','left','right'].forEach(k => setup(k, k));
        }

        drawFixedMaze(w, h) {
            const wallColor = 0x0055ff;
            const mazeWall = (x, y, width, height) => {
                let r = this.add.rectangle(x, y, width, height, wallColor).setStrokeStyle(2, 0x00ffff, 0.5);
                this.walls.add(r);
            };

            // Bordes Externos
            mazeWall(w/2, 65, w, 10); // Techo
            mazeWall(w/2, h-175, w, 10); // Piso

            if(gameData.level === 1) {
                // Laberinto Corregido Nivel 1 (Tipo Pacman funcional)
                mazeWall(w/2, 140, 20, 100); // Pilar central superior
                mazeWall(w/4, 210, w/2, 15); // Viga superior izq
                mazeWall(w*0.75, 210, w/2, 15); // Viga superior der
                
                mazeWall(20, h/2 - 20, 15, 120); // Obstáculo lateral izq
                mazeWall(w-20, h/2 - 20, 15, 120); // Obstáculo lateral der
                
                mazeWall(w/2, h/2 + 50, w*0.7, 15); // Viga central larga inferior
            } else {
                // Laberinto Corregido Nivel 2 (Diseño diferente)
                mazeWall(w/2, h/2 - 20, 20, h/2); // Gran pilar central
                mazeWall(w/2, h/2 - 20, w/2, 20); // Gran viga central
                
                mazeWall(w/4, 130, 20, 80); // Esquina sup izq
                mazeWall(w*0.75, 130, 20, 80); // Esquina sup der
                
                mazeWall(w/4, h-240, 20, 80); // Esquina inf izq
                mazeWall(w*0.75, h-240, 20, 80); // Esquina inf der
            }
        }

        getRandomDefect() {
            const types = [
                {type:"uniforme", img:"https://picsum.photos/id/1015/300/200", desc:"Ataque corrosivo generalizado."},
                {type:"pitting", img:"https://picsum.photos/id/201/300/200", desc:"Picaduras profundas localizadas."},
                {type:"galvánica", img:"https://picsum.photos/id/866/300/200", desc:"Contacto entre metales distintos."},
                {type:"erosión", img:"https://picsum.photos/id/1016/300/200", desc:"Desgaste por flujo turbulento."}
            ];
            return types[Math.floor(Math.random()*types.length)];
        }

        update() {
            if (gameData.isPaused) { 
                this.player.body.setVelocity(0); 
                this.enemies.children.iterate(e=>{if(e.body) e.body.setVelocity(0)});
                return; 
            }
            const speed = gameData.levels[gameData.level-1].speed;
            this.player.body.setVelocity(0);
            if (gameData.input.left) this.player.body.setVelocityX(-speed);
            else if (gameData.input.right) this.player.body.setVelocityX(speed);
            if (gameData.input.up) this.player.body.setVelocityY(-speed);
            else if (gameData.input.down) this.player.body.setVelocityY(speed);

            this.enemies.children.iterate(e => {
                if(e.active) this.physics.moveToObject(e, this.player, gameData.levels[gameData.level-1].enemySpeed);
            });
        }

        hitEnemy(p, e) {
            if (gameData.isPaused) return;
            gameData.isPaused = true;
            const def = e.defData;
            const modal = document.getElementById('inspection-modal');
            document.getElementById('corrosion-image').src = def.img;
            document.getElementById('modal-description').textContent = def.desc;
            const cont = document.getElementById('options-container');
            cont.innerHTML = '';
            ["Uniforme", "Pitting", "Galvánica", "Erosión"].forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn'; btn.textContent = opt;
                btn.onclick = () => {
                    if(opt.toLowerCase() === def.type.toLowerCase()) { e.destroy(); }
                    else { gameData.lives--; }
                    modal.style.display = 'none';
                    this.checkStatus();
                };
                cont.appendChild(btn);
            });
            modal.style.display = 'flex';
        }

        checkStatus() {
            document.getElementById('lives').textContent = "❤️".repeat(gameData.lives);
            if(gameData.lives <= 0) { alert("PLANTA FUERA DE SERVICIO"); location.reload(); }
            else {
                gameData.isPaused = false;
                if(this.enemies.countActive() === 0) {
                    if(gameData.toolsCollected < 10) {
                        alert("¡Fallas eliminadas, pero te faltan herramientas! Búscalas en la pista.");
                    } else {
                        if(gameData.level >= 2) { alert("¡Felicidades, Inspector! Planta asegurada."); location.reload(); }
                        else {
                            gameData.level++;
                            alert("¡Siguiente zona de inspección! El laberinto cambiará.");
                            this.scene.restart();
                        }
                    }
                }
            }
        }
    }

    new Phaser.Game({
        type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight,
        parent: 'game-container', backgroundColor: '#000',
        physics: { default: 'arcade' }, scene: CorroPac
    });
</script>
</body>
</html>
