<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CORROSION CRISIS: Inspector Pro</title>
    <style>
        body { margin: 0; background: #000; font-family: 'Courier New', Courier, monospace; overflow: hidden; color: #0f0; }
        
        #game-container { position: relative; width: 100vw; height: 100vh; background: #111; }

        /* TUBERÍA DINÁMICA */
        #pipe {
            position: absolute;
            bottom: 30%;
            width: 5000px;
            height: 90px;
            background: linear-gradient(to bottom, #555, #222);
            border-top: 5px solid #888;
            transition: transform 0.1s linear;
        }

        /* AVATAR */
        #inspector {
            position: absolute;
            bottom: calc(30% + 90px);
            left: 50px;
            font-size: 60px;
            z-index: 10;
            transition: 0.3s;
        }

        /* EFECTOS DE FALLA */
        .explosion { position: absolute; font-size: 80px; animation: boom 0.5s forwards; }
        @keyframes boom { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }

        /* PUNTOS DE DAÑO */
        .leak {
            position: absolute;
            top: -40px;
            width: 50px;
            height: 50px;
            background: #f00;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px #f00;
            animation: blink 0.5s infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } }

        /* UI */
        #status-bar { position: fixed; top: 0; width: 100%; background: #222; padding: 15px; border-bottom: 2px solid #0f0; display: flex; justify-content: space-around; font-size: 20px; z-index: 1000; }
        .life { color: #f00; font-size: 25px; }

        #controls { position: fixed; bottom: 20px; width: 100%; display: flex; justify-content: space-around; padding: 0 20px; box-sizing: border-box; }
        .btn { width: 120px; height: 120px; background: rgba(0,255,0,0.2); border: 3px solid #0f0; border-radius: 50%; color: #0f0; font-size: 40px; display: flex; align-items: center; justify-content: center; user-select: none; }

        /* MODAL */
        #modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; border: 4px solid #f00; padding: 25px; width: 85%; max-width: 450px; z-index: 2000; text-align: center;
        }
        #modal img { width: 100%; border: 2px solid #555; margin-bottom: 15px; }
        .opt { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #111; color: #0f0; border: 1px solid #0f0; font-family: inherit; cursor: pointer; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-bar">
        <div>PLANT HEALTH: <span id="life-icons">❤️❤️❤️</span></div>
        <div>SCORE: <span id="score-num">0</span></div>
    </div>

    <div id="inspector">👷</div>

    <div id="pipe">
        </div>

    <div id="controls">
        <div class="btn" id="left-btn">◀</div>
        <div class="btn" id="right-btn">▶</div>
    </div>
</div>

<div id="modal">
    <h2 style="color: #deff9a">¡ALERTA DE CORROSIÓN!</h2>
    <img id="q-img" src="">
    <p id="q-text" style="font-size: 14px; margin-bottom: 10px;"></p>
    <div id="q-options"></div>
</div>

<script>
    let playerPos = 0;
    let score = 0;
    let lives = 3;
    let isMoving = 0;

    const pipe = document.getElementById('pipe');
    const inspector = document.getElementById('inspector');
    const modal = document.getElementById('modal');

    // DATOS DE LAS FALLAS
    const scenarios = [
        { x: 600, img: "https://via.placeholder.com/400x250?text=PITTING+PHOTO", desc: "Ves hoyuelos localizados en el acero inoxidable. ¿Diagnóstico?", opts: ["Picaduras", "Uniforme", "Galvánica"], correct: 0 },
        { x: 1400, img: "https://via.placeholder.com/400x250?text=GALVANIC+PHOTO", desc: "Unión de aluminio con bronce bajo agua de mar. ¿Qué sucede?", opts: ["Erosión", "Intergranular", "Galvánica"], correct: 2 },
        { x: 2200, img: "https://via.placeholder.com/400x250?text=EROSION+PHOTO", desc: "El codo de la tubería presenta ondas de desgaste. ¿Causa?", opts: ["Esfuerzo", "Erosión-Corrosión", "Picaduras"], correct: 1 }
    ];

    // Crear fallas en el mapa
    scenarios.forEach((s, i) => {
        const d = document.createElement('div');
        d.className = 'leak';
        d.style.left = s.x + 'px';
        d.innerHTML = '⚠️';
        d.id = 's-' + i;
        d.onclick = () => openQuiz(i);
        pipe.appendChild(d);
    });

    // Motor de movimiento
    function loop() {
        if(isMoving !== 0) {
            playerPos -= isMoving * 8;
            if(playerPos > 0) playerPos = 0;
            pipe.style.transform = `translateX(${playerPos}px)`;
        }
        requestAnimationFrame(loop);
    }
    loop();

    // Controles
    const handleBtn = (id, dir) => {
        const b = document.getElementById(id);
        b.onmousedown = b.ontouchstart = (e) => { e.preventDefault(); isMoving = dir; inspector.style.transform = `scaleX(${dir})`; };
        b.onmouseup = b.ontouchend = () => isMoving = 0;
    };
    handleBtn('left-btn', -1);
    handleBtn('right-btn', 1);

    function openQuiz(idx) {
        isMoving = 0;
        const s = scenarios[idx];
        document.getElementById('q-img').src = s.img;
        document.getElementById('q-text').innerText = s.desc;
        const optDiv = document.getElementById('q-options');
        optDiv.innerHTML = '';

        s.opts.forEach((o, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt';
            btn.innerText = o;
            btn.onclick = () => checkAnswer(idx, i);
            optDiv.appendChild(btn);
        });
        modal.style.display = 'block';
    }

    function checkAnswer(idx, chosen) {
        modal.style.display = 'none';
        const s = scenarios[idx];
        const leakIcon = document.getElementById('s-' + idx);

        if(chosen === s.correct) {
            score += 100;
            leakIcon.innerHTML = '🛠️';
            leakIcon.style.background = '#0f0';
            leakIcon.style.animation = 'none';
            alert("✅ ¡REPARADO! Sumas 100 puntos.");
        } else {
            lives--;
            // EFECTO DE FALLA
            const exp = document.createElement('div');
            exp.className = 'explosion';
            exp.innerHTML = '💥🔥';
            exp.style.left = s.x + 'px';
            pipe.appendChild(exp);
            
            inspector.innerHTML = '💀';
            setTimeout(() => inspector.innerHTML = '👷', 1000);
            
            alert("❌ ¡FALLO CRÍTICO! La tubería ha colapsado.");
            updateLives();
        }
        document.getElementById('score-num').innerText = score;
        if(lives <= 0) { alert("GAME OVER: La planta ha sido clausurada."); location.reload(); }
    }

    function updateLives() {
        document.getElementById('life-icons').innerText = "❤️".repeat(lives);
    }
</script>
</body>
</html>
