<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CorroPac MOBILE</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    body { margin:0; background:#000; color:#00ff9d; font-family: sans-serif; overflow:hidden; touch-action: none; }
    #ui {
      position: absolute; top: 0; width: 100%; z-index: 100;
      background: rgba(10,20,40,0.9); padding: 8px 0; text-align: center; border-bottom: 2px solid #00ff9d;
    }
    #hud { font-size: 1em; display: flex; justify-content: center; gap: 15px; font-weight: bold; }
    
    /* MODAL MÓVIL */
    .modal {
      display:none; position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.95); z-index:2000; align-items:center; justify-content:center;
    }
    .modal-content {
      background:#0d1b2a; padding:15px; border-radius:10px; width:85%; max-width:400px;
      border:3px solid #00ff9d; text-align:center;
    }
    #corrosion-image { width:100%; border-radius:8px; margin: 10px 0; }
    .opt-btn {
      width:100%; padding:12px; margin:5px 0; background:#1b263b; border:2px solid #00ff9d; color:#00ff9d;
      font-size: 1em; font-weight: bold; border-radius: 5px;
    }

    /* CONTROLES TÁCTILES */
    #mobile-controls {
      position: fixed; bottom: 20px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 10px; z-index: 150;
    }
    .joy-btn {
      width: 65px; height: 65px; background: rgba(0, 255, 157, 0.2);
      border: 2px solid #00ff9d; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: #00ff9d; user-select: none;
    }
  </style>
</head>
<body>

<div id="ui">
  <div id="hud">
    <span>💰 $<span id="money">1500</span></span>
    <span>❤️ <span id="lives">❤️❤️❤️</span></span>
    <span>🏭 Lv: <span id="level">1</span></span>
  </div>
</div>

<div id="inspection-modal" class="modal">
  <div class="modal-content">
    <h3 style="margin:0; color: #00ff9d;">INSPECCIÓN DE CAMPO</h3>
    <img id="corrosion-image" src="">
    <p id="modal-description" style="font-size: 0.8em; color: #ccc;"></p>
    <div id="options-container"></div>
  </div>
</div>

<div id="mobile-controls">
  <div style="display: grid; grid-template-columns: 70px 70px 70px; gap: 5px;">
    <div></div><div class="joy-btn" id="up">▲</div><div></div>
    <div class="joy-btn" id="left">◀</div><div class="joy-btn" id="down">▼</div><div class="joy-btn" id="right">▶</div>
  </div>
</div>

<script>
    const gameData = {
        money: 1500, lives: 3, level: 1, isPaused: false,
        input: { up: false, down: false, left: false, right: false },
        levels: [
            { defects: 3, speed: 160, enemySpeed: 80 },
            { defects: 5, speed: 180, enemySpeed: 100 },
            { defects: 7, speed: 200, enemySpeed: 120 }
        ]
    };

    class CorroPac extends Phaser.Scene {
        constructor() { super('CorroPac'); }

        create() {
            const config = gameData.levels[gameData.level - 1];
            this.physics.world.setBounds(0, 60, window.innerWidth, window.innerHeight - 150);

            // Laberinto
            this.walls = this.physics.add.staticGroup();
            this.createMaze();

            // Inspector
            this.player = this.add.container(50, 100);
            this.player.add([this.add.circle(0, 0, 15, 0x00ff9d).setStrokeStyle(2, 0xffffff), this.add.text(-10, -18, '👷', {fontSize:'22px'})]);
            this.physics.add.existing(this.player);
            this.player.body.setCircle(15, -15, -15).setCollideWorldBounds(true);
            this.physics.add.collider(this.player, this.walls);

            // Daños (Pepas)
            this.enemies = this.physics.add.group();
            for(let i=0; i < config.defects; i++) {
                let enemy = this.add.container(Phaser.Math.Between(200, window.innerWidth-50), Phaser.Math.Between(150, window.innerHeight-200));
                enemy.add(this.add.text(-12, -12, '⚠️', {fontSize:'24px'}));
                this.physics.add.existing(enemy);
                enemy.body.setCircle(12, -12, -12).setCollideWorldBounds(true).setBounce(1);
                enemy.defData = this.getRandomDefect();
                this.enemies.add(enemy);
            }

            this.physics.add.collider(this.enemies, this.walls);
            this.physics.add.overlap(this.player, this.enemies, this.hitEnemy, null, this);

            // Setup Controles Móviles
            const setup = (id, key) => {
                const btn = document.getElementById(id);
                btn.ontouchstart = (e) => { e.preventDefault(); gameData.input[key] = true; };
                btn.ontouchend = () => gameData.input[key] = false;
            };
            ['up','down','left','right'].forEach(k => setup(k, k));
        }

        createMaze() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const layout = [[w/2, h/2, 20, h/3], [w/4, h/2, w/3, 20], [w*0.75, h/4, 20, h/4]];
            layout.forEach(p => this.walls.add(this.add.rectangle(p[0], p[1], p[2], p[3], 0x1b263b)));
        }

        getRandomDefect() {
            const types = [
                {type:"uniforme", img:"https://picsum.photos/id/1015/300/200", desc:"Corrosión generalizada."},
                {type:"pitting", img:"https://picsum.photos/id/201/300/200", desc:"Picaduras profundas."},
                {type:"galvánica", img:"https://picsum.photos/id/866/300/200", desc:"Par galvánico."},
                {type:"erosión", img:"https://picsum.photos/id/1016/300/200", desc:"Erosión-corrosión."}
            ];
            return types[Math.floor(Math.random()*types.length)];
        }

        update() {
            if (gameData.isPaused) { this.player.body.setVelocity(0); this.enemies.children.iterate(e => {if(e.body) e.body.setVelocity(0)}); return; }
            
            const speed = gameData.levels[gameData.level-1].speed;
            this.player.body.setVelocity(0);
            if (gameData.input.left) this.player.body.setVelocityX(-speed);
            else if (gameData.input.right) this.player.body.setVelocityX(speed);
            if (gameData.input.up) this.player.body.setVelocityY(-speed);
            else if (gameData.input.down) this.player.body.setVelocityY(speed);

            this.enemies.children.iterate(e => { if(e.active) this.physics.moveToObject(e, this.player, gameData.levels[gameData.level-1].enemySpeed); });
        }

        hitEnemy(player, enemy) {
            if (gameData.isPaused) return;
            gameData.isPaused = true;
            const def = enemy.defData;
            document.getElementById('corrosion-image').src = def.img;
            document.getElementById('modal-description').textContent = def.desc;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            ["Uniforme", "Pitting", "Galvánica", "Erosión"].forEach(opt => {
                const b = document.createElement('button');
                b.className = 'opt-btn';
                b.textContent = opt;
                b.onclick = () => {
                    if(opt.toLowerCase() === def.type.toLowerCase()) {
                        enemy.destroy();
                        gameData.money += 500;
                    } else {
                        gameData.lives--;
                        gameData.money -= 200;
                    }
                    document.getElementById('inspection-modal').style.display = 'none';
                    this.checkGameState();
                };
                container.appendChild(b);
            });
            document.getElementById('inspection-modal').style.display = 'flex';
        }

        checkGameState() {
            document.getElementById('money').textContent = gameData.money;
            document.getElementById('lives').textContent = "❤️".repeat(gameData.lives);
            if(gameData.lives <= 0) { alert("GAME OVER"); location.reload(); }
            else { 
                gameData.isPaused = false; 
                if(this.enemies.countActive() === 0) { 
                    gameData.level++; 
                    alert("¡Nivel Superado!"); 
                    this.scene.restart(); 
                }
            }
        }
    }

    new Phaser.Game({
        type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight,
        parent: 'game-container', physics: { default: 'arcade' }, scene: CorroPac
    });
</script>
</body>
</html>
