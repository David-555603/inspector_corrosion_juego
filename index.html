<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorroPac - Inspector de Tuberías</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
    body { margin:0; background:#000; color:#00ff9d; font-family:Arial, sans-serif; overflow:hidden; }
    #ui { position:absolute; top:0; left:0; right:0; z-index:100; background:rgba(10,20,40,0.95); padding:10px; text-align:center; border-bottom:3px solid #00ff9d; }
    h1 { margin:0; font-size:2.4em; }
    #hud { font-size:1.3em; margin:8px 0; }
    button { padding:8px 16px; background:#006633; color:white; border:none; border-radius:6px; cursor:pointer; }
    .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.95); z-index:200; align-items:center; justify-content:center; }
    .modal-content { background:#0f1f33; padding:25px; border-radius:15px; max-width:720px; width:90%; border:4px solid #00ff9d; text-align:center; }
    #corrosion-image { width:100%; max-height:360px; border-radius:10px; margin:15px 0; }
    #options-container button { width:100%; padding:14px; margin:10px 0; font-size:1.15em; background:#1a2a44; border:2px solid #00cc88; color:#00ff9d; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>🪖 CorroPac - Inspector de Tuberías</h1>
    <div id="hud">Dinero: $<span id="money">1200</span> | Nivel: <span id="level">1</span> | Strikes: <span id="strikes">0</span>/3 | Fallas: <span id="defects">0</span>/<span id="total">0</span></div>
    <button id="reset-btn">Reiniciar Nivel</button>
  </div>

  <div id="game-container"></div>

  <div id="inspection-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">🔍 Falla Detectada</h2>
      <img id="corrosion-image" src="" alt="Corrosión">
      <p id="modal-description"></p>
      <div id="options-container"></div>
      <button id="close-modal" style="margin-top:15px;">Cerrar</button>
    </div>
  </div>

  <script>
    const gameData = {
      money: 1200,
      strikes: 0,
      level: 1,
      defectsFound: 0,
      levels: [
        {
          name: "Tubería Principal - Nivel 1",
          bgColor: "#0a1f1a",
          playerSpeed: 180,
          defects: [
            {x:300, y:200, type:"uniforme", image:"https://picsum.photos/id/1015/800/500", desc:"Daño uniforme en las paredes.", options:[{text:"Corrosión Uniforme",correct:true},{text:"Pitting",correct:false},{text:"Galvánica",correct:false},{text:"Crevice",correct:false}]},
            {x:600, y:400, type:"galvanica", image:"https://picsum.photos/id/201/800/500", desc:"Corrosión cerca de una unión metálica.", options:[{text:"Corrosión Uniforme",correct:false},{text:"Pitting",correct:false},{text:"Galvánica",correct:true},{text:"Crevice",correct:false}]},
            {x:450, y:150, type:"pitting", image:"https://picsum.photos/id/866/800/500", desc:"Pequeños hoyos profundos.", options:[{text:"Corrosión Uniforme",correct:false},{text:"Pitting",correct:true},{text:"Galvánica",correct:false},{text:"Crevice",correct:false}]}
          ]
        },
        {
          name: "Tubería Offshore - Nivel 2",
          bgColor: "#1a1f3a",
          playerSpeed: 200,
          defects: [
            {x:250, y:300, type:"crevice", image:"https://picsum.photos/id/1015/800/500", desc:"Corrosión en junta.", options:[{text:"Crevice",correct:true},{text:"Pitting",correct:false},{text:"Uniforme",correct:false},{text:"Galvánica",correct:false}]},
            {x:550, y:250, type:"pitting", image:"https://picsum.photos/id/201/800/500", desc:"Hoyos concentrados.", options:[{text:"Pitting",correct:true},{text:"Crevice",correct:false},{text:"Uniforme",correct:false},{text:"Galvánica",correct:false}]},
            {x:400, y:450, type:"uniforme", image:"https://picsum.photos/id/866/800/500", desc:"Desgaste general.", options:[{text:"Uniforme",correct:true},{text:"Pitting",correct:false},{text:"Crevice",correct:false},{text:"Galvánica",correct:false}]},
            {x:700, y:180, type:"galvanica", image:"https://picsum.photos/id/1015/800/500", desc:"Corrosión por contacto de metales.", options:[{text:"Galvánica",correct:true},{text:"Uniforme",correct:false},{text:"Pitting",correct:false},{text:"Crevice",correct:false}]}
          ]
        },
        {
          name: "Refinería - Nivel 3 (Difícil)",
          bgColor: "#3a1f1a",
          playerSpeed: 220,
          defects: [
            {x:200, y:200, type:"pitting", image:"https://picsum.photos/id/201/800/500", desc:"Pitting severo bajo aislamiento.", options:[{text:"Pitting",correct:true},{text:"Uniforme",correct:false},{text:"Crevice",correct:false},{text:"Galvánica",correct:false}]},
            {x:500, y:350, type:"crevice", image:"https://picsum.photos/id/866/800/500", desc:"Corrosión en grieta.", options:[{text:"Crevice",correct:true},{text:"Pitting",correct:false},{text:"Uniforme",correct:false},{text:"Galvánica",correct:false}]},
            {x:650, y:280, type:"galvanica", image:"https://picsum.photos/id/1015/800/500", desc:"Contacto entre metales diferentes.", options:[{text:"Galvánica",correct:true},{text:"Pitting",correct:false},{text:"Uniforme",correct:false},{text:"Crevice",correct:false}]}
          ]
        }
      ]
    };

    class CorroPac extends Phaser.Scene {
      constructor() { super('CorroPac'); }

      create() {
        this.level = gameData.levels[gameData.level-1];
        this.cameras.main.setBackgroundColor(this.level.bgColor);

        this.add.text(50, 50, this.level.name, {fontSize:'26px', color:'#00ff9d', fontStyle:'bold'});

        // Jugador (Inspector con casco)
        this.player = this.add.rectangle(100, 300, 35, 35, 0x00ff9d).setStrokeStyle(4, 0xffffff);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);

        // Defectos (como puntos de Pac-Man)
        this.defects = [];
        this.level.defects.forEach((def, i) => {
          const dot = this.add.circle(def.x, def.y, 18, 0xff0000);
          dot.defData = def;
          dot.setInteractive();
          this.defects.push(dot);
        });

        this.defectsRemaining = this.level.defects.length;
        document.getElementById('total').textContent = this.defectsRemaining;

        // Controles
        this.cursors = this.input.keyboard.createCursorKeys();

        this.updateHUD();
      }

      update() {
        const speed = this.level.playerSpeed;
        const body = this.player.body;

        if (this.cursors.left.isDown) body.setVelocityX(-speed);
        else if (this.cursors.right.isDown) body.setVelocityX(speed);
        else body.setVelocityX(0);

        if (this.cursors.up.isDown) body.setVelocityY(-speed);
        else if (this.cursors.down.isDown) body.setVelocityY(speed);
        else body.setVelocityY(0);

        // Revisar colisiones con defectos
        this.defects.forEach((dot, index) => {
          if (dot.active && Phaser.Geom.Intersects.RectangleToRectangle(this.player.getBounds(), dot.getBounds())) {
            this.inspectDefect(dot, index);
          }
        });

        // Completar nivel
        if (this.defectsRemaining <= 0) {
          this.completeLevel();
        }
      }

      inspectDefect(dot, index) {
        const def = dot.defData;
        document.getElementById('modal-title').textContent = `Falla: ${def.type.toUpperCase()}`;
        document.getElementById('corrosion-image').src = def.image;
        document.getElementById('modal-description').textContent = def.desc;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        def.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.textContent = opt.text;
          btn.onclick = () => this.checkAnswer(opt, def, dot, index);
          container.appendChild(btn);
        });

        document.getElementById('inspection-modal').style.display = 'flex';
      }

      checkAnswer(option, def, dot, index) {
        if (option.correct) {
          alert("✅ ¡Correcto! Buen diagnóstico.");
          gameData.money += 380;
        } else {
          alert("❌ Incorrecto. Era " + def.type.toUpperCase());
          gameData.strikes++;
          gameData.money -= 280;
        }

        dot.destroy();
        this.defectsRemaining--;
        this.updateHUD();

        document.getElementById('inspection-modal').style.display = 'none';

        if (gameData.strikes >= 3) {
          alert("💥 ¡Demasiados errores! Nivel fallado.");
          location.reload();
        }
      }

      completeLevel() {
        alert(`¡Nivel ${gameData.level} Completado! 🎉`);
        gameData.level++;
        if (gameData.level > 3) {
          alert("¡FELICIDADES! Has completado todos los niveles.");
          gameData.level = 1;
        }
        location.reload();
      }

      updateHUD() {
        document.getElementById('money').textContent = gameData.money;
        document.getElementById('level').textContent = gameData.level;
        document.getElementById('strikes').textContent = gameData.strikes;
        document.getElementById('defects').textContent = this.defectsRemaining || 0;
      }
    }

    window.onload = () => {
      const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        parent: 'game-container',
        scene: CorroPac,
        physics: { default: 'arcade', arcade: { debug: false } }
      };

      new Phaser.Game(config);

      document.getElementById('reset-btn').onclick = () => location.reload();
      document.getElementById('close-modal').onclick = () => document.getElementById('inspection-modal').style.display = 'none';

      alert("¡Bienvenido a CorroPac!\n\nUsa las flechas del teclado para mover al inspector dentro de la tubería.\nEncuentra y diagnostica todas las fallas rojas.");
    };
  </script>
</body>
</html>
